<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C5CD6">
<title>데굴데굴 관찰 실험실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 어린이용 실험 앱 — 위: 시뮬레이션 캔버스, 아래: 큰 조작 버튼과 관찰 질문, 하단 탭 2개 */
:root{
  --bg:#F3EEFD; --surface:#FFFFFF; --ink:#1F2D3D; --muted:#5A6B80; --line:#DDD4F3;
  --purple:#7C5CD6; --purple-soft:#ECE6FB; --sun:#FFC531; --sun-soft:#FFF4CC;
  --orange:#E8692A; --orange-soft:#FDE6D8; --green:#23A26B; --green-soft:#DDF3E7; --blue:#2B8AD8; --blue-soft:#DCEBFA;
  --red:#E0483A; --wood:#E9C79A; --wood-dark:#B88A55; --sky:#F7F4FF; --floor:#D9D2C5;
  --sec:var(--purple); --sec-soft:var(--purple-soft);
  --font-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17142A; --surface:#221E38; --ink:#EEF0FA; --muted:#AEB2C8; --line:#3A3458; --purple:#A18BF0; --purple-soft:#2E2850;
  --sun:#FFD25A; --sun-soft:#3A3318; --orange:#F48C55; --orange-soft:#3E2A1E; --green:#4CCB8D; --green-soft:#1C3A2D; --blue:#5AAAF0; --blue-soft:#20384F;
  --red:#FF7466; --wood:#C9A574; --wood-dark:#8C6A40; --sky:#1C1931; --floor:#3A3546; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17142A; --surface:#221E38; --ink:#EEF0FA; --muted:#AEB2C8; --line:#3A3458; --purple:#A18BF0; --purple-soft:#2E2850;
  --sun:#FFD25A; --sun-soft:#3A3318; --orange:#F48C55; --orange-soft:#3E2A1E; --green:#4CCB8D; --green-soft:#1C3A2D; --blue:#5AAAF0; --blue-soft:#20384F;
  --red:#FF7466; --wood:#C9A574; --wood-dark:#8C6A40; --sky:#1C1931; --floor:#3A3546; color-scheme:dark}
body[data-sec="roll"]{--sec:var(--orange);--sec-soft:var(--orange-soft)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--sec-soft);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.55;margin:0;min-height:100vh;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));transition:background .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sec)}
.wrap{max-width:900px;margin:0 auto}
@media (min-width:760px){html{zoom:1.15}}
@media (min-width:1100px) and (min-height:700px){html{zoom:1.35}}
@media (min-width:1500px) and (min-height:950px){html{zoom:1.6}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));
  padding:10px max(14px,env(safe-area-inset-right,0px)) 12px max(14px,env(safe-area-inset-left,0px));background:var(--sec);color:#fff;border-radius:0 0 24px 24px;
  display:flex;align-items:center;gap:10px;transition:background .3s}
header h1{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;line-height:1.15;flex:1;min-width:0}
header h1 small{display:block;font-size:14px;opacity:.92}
.stars{font-family:var(--font-display);background:#fff;color:#1F2D3D;border-radius:999px;padding:6px 14px;font-size:20px;white-space:nowrap}
.stars.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}
.talk{display:flex;align-items:flex-end;gap:6px;margin:14px 0 12px}
.talk img{width:76px;flex:none}
.bubble{position:relative;background:var(--surface);border:3px solid var(--sun);border-radius:22px;padding:9px 14px;font-family:var(--font-display);font-size:19px;line-height:1.35;flex:1;min-width:0}
.bubble::after{content:"";position:absolute;left:-12px;bottom:16px;width:16px;height:16px;background:var(--surface);border-left:3px solid var(--sun);border-bottom:3px solid var(--sun);transform:rotate(45deg)}
.card{background:var(--surface);border:3px solid var(--line);border-radius:24px;padding:14px;margin-bottom:14px}
h3{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0 0 8px;line-height:1.3}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--sky);border:3px solid var(--line)}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.phase{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.phase span{font-family:var(--font-display);font-size:14px;line-height:1.25;text-align:center;padding:7px 4px;border-radius:12px;background:var(--bg);color:var(--muted);border:2px solid transparent}
.phase span b{display:block;font-weight:400;font-size:17px}
.phase span.on{background:var(--sun-soft);color:var(--ink);border-color:var(--sun)}
.msg{font-family:var(--font-display);font-size:19px;border-radius:16px;padding:10px 14px;margin-top:10px;background:var(--sec-soft);min-height:52px;display:flex;align-items:center;gap:8px}
.msg.ok{background:var(--green-soft)}
.msg.no{background:var(--orange-soft)}
.ctrl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:12px}
.btn{font:inherit;font-family:var(--font-display);font-size:20px;border:0;border-radius:18px;padding:12px 10px;cursor:pointer;background:var(--sec);color:#fff;min-height:56px;box-shadow:0 5px 0 color-mix(in srgb,var(--sec) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--sec) 60%,#000)}
.btn.ghost{background:var(--surface);color:var(--sec);border:3px solid var(--sec);box-shadow:none}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.opt:focus-visible,.tog:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.group{margin-top:12px}
.group>label,.glabel{display:block;font-family:var(--font-display);font-size:17px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--font-display);font-size:16px;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--sec);background:var(--sec);color:#fff}
.togs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tog{font:inherit;font-family:var(--font-display);font-size:16px;display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 10px;cursor:pointer;text-align:left}
.tog i{width:22px;height:22px;border-radius:6px;border:3px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:14px;color:#fff}
.tog[aria-pressed="true"]{border-color:var(--sec)}
.tog[aria-pressed="true"] i{background:var(--sec);border-color:var(--sec)}
.tog[aria-pressed="true"] i::after{content:"✓"}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.q{border-top:3px dashed var(--line);padding-top:12px;margin-top:12px}
.q:first-of-type{border-top:0;padding-top:0;margin-top:0}
.q p{font-family:var(--font-display);font-size:18px;margin:0 0 8px;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;border:3px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:9px 12px;cursor:pointer;min-height:48px;font-size:17px}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--orange-soft)}
.fb{border-radius:14px;padding:9px 12px;margin-top:8px;font-size:16px;background:var(--green-soft)}
.fb.no{background:var(--orange-soft)}
.fb:empty{display:none}
.fb b{font-family:var(--font-display);font-weight:400;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:center;border-bottom:2px solid var(--line)}
th{font-family:var(--font-display);font-weight:400;color:var(--muted)}
td.best{color:var(--green);font-weight:700}
.tablewrap{overflow-x:auto}
.empty{color:var(--muted);font-size:15px;text-align:center;padding:8px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:15px;color:var(--muted);margin-top:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:3px solid var(--line);display:flex;justify-content:center;gap:8px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));border-radius:24px 24px 0 0}
.tab{flex:1;max-width:260px;font:inherit;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;padding:6px 0 4px;cursor:pointer;font-family:var(--font-display);font-size:16px;border-radius:16px;line-height:1.25}
.tab .ic{font-size:24px}
.tab[aria-selected="true"]{color:#fff}
.tab[data-tab="v-stairs"][aria-selected="true"]{background:var(--purple)}
.tab[data-tab="v-roll"][aria-selected="true"]{background:var(--orange)}
.burst{position:fixed;left:50%;top:40%;font-size:64px;pointer-events:none;z-index:20;animation:burst .9s forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
@media (prefers-reduced-motion: reduce){.burst{display:none}.stars.pop{animation:none}}
</style>
</head>

<div class="wrap">
<header>
  <h1>데굴데굴 관찰 실험실<small>덤블링 계단 · 누가 멀리 구를까?</small></h1>
  <div class="stars" id="starBox" aria-live="polite">⭐ <span id="starN">0</span></div>
</header>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem('roll_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('roll_'+k,JSON.stringify(v))}catch(e){}}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 별 ---------- */
let stars=store.get('stars',{});
function renderStars(){$('#starN').textContent=Object.keys(stars).length}
function star(k){if(stars[k])return;stars[k]=1;store.set('stars',stars);renderStars();
  const b=document.createElement('div');b.className='burst';b.textContent='⭐';document.body.appendChild(b);setTimeout(()=>b.remove(),950);
  const s=$('#starBox');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}
renderStars();

/* ---------- 탭 ---------- */
function go(id){$$('[data-view]').forEach(v=>v.hidden=v.id!==id);$$('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===id));
  document.body.dataset.sec=id==='v-roll'?'roll':'stairs';store.set('tab',id);if(id==='v-roll')draw2();else draw1();}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.tab));

/* ---------- 칩 그룹 ---------- */
function chipGroup(name,cb){const g=$(`[data-set="${name}"]`);g.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
  g.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));cb(c.dataset.v)});
  return ()=>g.querySelector('[aria-pressed="true"]').dataset.v}

/* ---------- 캔버스 공통 ---------- */
function fit(cv,ratio){const w=cv.clientWidth||cv.parentElement.clientWidth||600;const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*ratio*dpr);const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return {c,W:w,H:w*ratio}}

/* =====================================================================
   1. 덤블링 계단
   ===================================================================== */
const cv1=$('#cv1');let G1;
const S={speed:0.6,ball:'steel',gap:'ok',show:{com:true,grav:true,trail:false,xray:true}};
const NSTEP=5, TH=33*Math.PI/180;
let st; // simulation state
function geom(){
  const {W,H}=G1; const s=W*0.165, T=s*0.34;
  const d={x:Math.cos(TH),y:Math.sin(TH)}, nu={x:Math.sin(TH),y:-Math.cos(TH)};
  const P0={x:W*0.13,y:H*0.3};
  // 계단 간격: 첫 두 코는 굴림통 길이(L=s)와 같고, 그 뒤는 선택에 따라 달라짐
  const f=S.gap==='wide'?1.38:S.gap==='narrow'?0.72:1;
  const noses=[P0];let acc=0;
  for(let k=1;k<=NSTEP;k++){const sp=k===1?s:s*f;acc+=sp;noses.push({x:P0.x+d.x*acc,y:P0.y+d.y*acc})}
  return {W,H,s,L:s,T,d,nu,noses,f};
}
function reset1(){
  G1=fit(cv1,0.8);const g=geom();
  st={g,k:1,phase:-1,t:0,phi:0,ballX:-g.L,flips:0,running:false,done:false,fail:null,falling:null,trail:[],wob:0,stepMode:false};

function drawStairs(c,g){
  const n=g.noses, th=g.T*0.55;

  c.fillStyle=css('--wood-dark');

  c.fillRect(legA.x-6, legA.y+th, 12, g.H-legA.y-th-14);
  c.fillRect(legB.x-6, legB.y+th, 12, g.H-legB.y-th-14);
  // 톱니 계단
  c.beginPath();c.moveTo(n[0].x-g.s*0.35,n[0].y);
  for(let k=0;k<n.length;k++){const p=n[k];c.lineTo(p.x,p.y);if(k<n.length-1){c.lineTo(p.x,n[k+1].y)}}
  const last=n[n.length-1];c.lineTo(last.x+8,last.y);
  const off={x:-g.nu.x*th,y:-g.nu.y*th};
  c.lineTo(last.x+8+off.x*2,last.y+off.y*2+th);
  c.lineTo(n[0].x-g.s*0.35+off.x*2,n[0].y+off.y*2+th);
  c.closePath();c.fillStyle=css('--wood');c.fill();c.lineWidth=2;c.strokeStyle=css('--wood-dark');c.stroke();
  // 바닥

}
function drawCapsule(c,pv,ang,parity,ballX,show){

    c.fillStyle='#fff';c.beginPath();c.arc(-T*0.38,-T*0.1,T*0.05,0,7);c.arc(T*0.46,-T*0.1,T*0.05,0,7);c.fill();
    c.fillStyle='#F58F8F';c.beginPath();c.arc(-T*0.62,T*0.18,T*0.07,0,7);c.arc(T*0.62,T*0.18,T*0.07,0,7);c.fill();
    c.fillStyle='#2B2B2B';c.beginPath();c.arc(0,T*0.12,T*0.05,0,7);c.fill();
  }
  c.restore();
  // 속 통로와 쇠구슬
  if(show.xray){
    c.strokeStyle='rgba(120,80,40,.45)';c.lineWidth=T*0.36;c.lineCap='round';c.beginPath();c.moveTo(-L,T*0.3);c.lineTo(0,T*0.3);c.stroke();
    c.lineWidth=T*0.36;c.strokeStyle='rgba(255,255,255,.35)';
  }
  if(S.ball!=='none'){
    const br=S.ball==='steel'?T*0.27:T*0.29;
    const gx=ballX, gy=T*0.3;

}
function curPose(){

  const cx=comLocal();const cw=toWorld(pose.pv,pose.ang,cx,S.ball==='none'?0:T*0.3*MASS[S.ball]/(1+MASS[S.ball]));
  if(S.show.grav){const len=W*0.075*(1+MASS[S.ball]*0.5);arrow(c,cw.x,cw.y,cw.x,cw.y+len,css('--blue'),4);

    c.fillStyle=css('--red');c.beginPath();c.arc(cw.x,cw.y,W*0.008,0,7);c.fill();
    label(c,'무게중심',cw.x+W*0.025,cw.y-W*0.1,css('--red'),W)}
  // 받침점 표시
  if(!st.falling&&st.phase>=1&&st.phase<=2){const n=g.noses[st.k];c.fillStyle=css('--sun');c.beginPath();c.arc(n.x,n.y,W*0.012,0,7);c.fill();c.strokeStyle=css('--ink');c.lineWidth=1.5;c.stroke()}

function label(c,txt,x,y,col,W){const fs=Math.round(W*0.04);c.font=`${fs}px Jua, sans-serif`;const w=c.measureText(txt).width+fs*0.8,h=fs*1.45;
  c.fillStyle='rgba(255,255,255,.92)';c.beginPath();c.roundRect?c.roundRect(x,y,w,h,h/2):c.rect(x,y,w,h);c.fill();c.lineWidth=2;c.strokeStyle=col;c.stroke();c.fillStyle=col;c.fillText(txt,x+fs*0.4,y+h*0.72)}
function arrow(c,x1,y1,x2,y2,col,w){c.strokeStyle=col;c.fillStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();

/* 단계 진행: phase 0 구슬 굴러감, 1 무게중심 이동(잠깐 멈춤), 2 넘어가기, 3 착지 */
const DUR={0:1.0,1:0.55,2:0.85,3:0.5};
function startPhase(p){st.phase=p;st.t=0;setPhase(p);
  const say={0:'① 쇠구슬이 중력 때문에 아래쪽 끝으로 굴러가요.',1:'② 쇠구슬을 따라 무게중심도 아래쪽으로 옮겨갔어요.',2:'③ 무게중심이 앞쪽으로 쏠려서 굴림통이 앞으로 넘어가요!',3:'④ 한 칸 내려왔어요. 이제 쇠구슬이 다시 위쪽에 있어요.'};
  if(S.ball==='none'&&p===0)msg1('쇠구슬이 없으면… 굴림통이 어떻게 될까요?');
  else msg1(say[p]);
}
function tick1(dt){
  if(!st.running||st.done)return;
  dt*=S.speed;
  if(st.falling){const f=st.falling;f.v.y+=900*dt*(G1.W/800);f.p.x+=f.v.x*dt;f.p.y+=f.v.y*dt;f.a+=f.w*dt;
    if(f.p.y>G1.H-30){f.p.y=G1.H-30;f.v.y*=-0.25;f.v.x*=0.5;f.w*=0.4;if(Math.abs(f.v.y)<40){st.done=true;st.running=false;
      msg1('앗, 굴림통이 계단에서 떨어졌어요! 계단 간격이 굴림통 길이와 맞아야 해요.','no');setPhase(-1);$('#play1').textContent='▶ 출발';}}
    return}
  st.t+=dt;const u=Math.min(1,st.t/DUR[st.phase]);const g=st.g;
  if(st.phase===0){
    if(S.ball==='none'){if(u>=1){fail('none')}return}
    st.ballX=-g.L+g.L*u*u;
    if(u>=1)next();
  }else if(st.phase===1){
    if(S.ball==='light'){st.phi=0.16*Math.sin(u*Math.PI*2)*(1-u);if(u>=1){st.phi=0;fail('light')}return}
    if(u>=1)next();
  }else if(st.phase===2){
    const heavy=S.ball==='steel'?1:0.8;
    const ease=Math.pow(u,1.7);
    let target=Math.PI;
    const nextIdx=st.k+1;
    if(S.gap==='narrow'&&st.k>=1){target=Math.PI-0.42}
    st.phi=target*ease;
    if(S.show.trail){const pose=curPose();const cw=toWorld(pose.pv,pose.ang,comLocal(),0);st.trail.push(cw)}
    if(u>=1){
      if(S.gap==='narrow'&&st.k>=1){fail('narrow');return}
      if(S.gap==='wide'&&st.k>=1){ // 다음 코에 닿지 못하고 공중에서 떨어짐
        const pose=curPose();const center=toWorld(pose.pv,pose.ang,-g.L/2,0);
        st.falling={p:pose.pv,a:pose.ang,v:{x:g.s*1.2,y:-g.s*0.4},w:2.4};
        // 회전 중심을 몸통 중심으로 옮겨서 자연스럽게
        st.falling.p=pose.pv;msg1('어? 다음 계단에 닿지 않아요!','no');return}
      next();
    }
  }else if(st.phase===3){
    if(u>=1){next()}
  }
  if(S.show.trail&&st.phase!==2&&st.trail.length<2000){const pose=curPose();st.trail.push(toWorld(pose.pv,pose.ang,comLocal(),0))}
}
function next(){
  const p=st.phase;
  if(p===2){ // 넘어가기 완료: 받침점이 다음 코로, 구슬은 이제 위쪽 끝
    st.k+=1;st.flips+=1;st.phi=0;st.ballX=-st.g.L;startPhase(3);
    if(st.flips===1)star('s_first');
    return}
  if(p===3){
    if(st.k>=NSTEP){st.done=true;st.running=false;setPhase(-1);msg1('🎉 맨 아래까지 데굴데굴 다 내려왔어요!','ok');$('#play1').textContent='▶ 출발';star('s_done');return}
    startPhase(0);if(st.stepMode){st.running=false;$('#play1').textContent='▶ 계속'}return}
  startPhase(p+1);if(st.stepMode){st.running=false;$('#play1').textContent='▶ 계속'}
}

  if(kind==='light'){msg1('가벼운 구슬은 무게중심을 조금밖에 못 옮겨요. 흔들리기만 하고 넘어가지 못했어요.','no');star('s_light')}
  if(kind==='narrow'){msg1('계단 간격이 너무 좁아서 굴림통이 계단에 걸려 멈췄어요.','no');star('s_gap')}
}

function push(){reset2();const v=R2.force;rs.ball.v=v;rs.box.v=v;rs.running=true;rs.hand=0.5;msg2('같은 힘으로 밀었어요! 누가 더 멀리 갈까?')}
let logs=store.get('logs',[]);
function record(){const f=FLOORS[R2.floor];const fname={'1.6':'살짝','2.4':'보통','3.2':'세게'}[String(R2.force)];
  const bd=rs.ball.x>LANE?'10m 넘음':rs.ball.x.toFixed(1)+' m';logs.unshift({f:f.n,p:fname,b:bd,bx:rs.box.x.toFixed(1)+' m'});logs=logs.slice(0,12);store.set('logs',logs);renderLog();
  msg2(`공은 ${bd}, 상자는 ${rs.box.x.toFixed(1)} m 갔어요. 둥근 공이 훨씬 멀리 굴러갔어요!`,'ok');
  star('r_'+R2.floor);}
function renderLog(){const tb=$('#log');if(!logs.length){tb.innerHTML='<tr><td colspan="4" class="empty">밀기를 하면 여기에 기록돼요.</td></tr>';return}
  tb.innerHTML=logs.map(l=>`<tr><td>${l.f}</td><td>${l.p}</td><td class="best">${l.b}</td><td>${l.bx}</td></tr>`).join('')}
$('#push').onclick=push;$('#reset2').onclick=reset2;
chipGroup('floor',v=>{R2.floor=+v;reset2()});chipGroup('force',v=>{R2.force=+v;reset2()});
$('[data-tog2="fric"]').onclick=e=>{R2.fric=!R2.fric;e.currentTarget.setAttribute('aria-pressed',R2.fric);draw2()};
renderLog();

/* =====================================================================
   관찰 질문
   ===================================================================== */
const Q1=[
 {q:'굴림통이 앞으로 넘어가기 바로 전, 쇠구슬은 어디에 있나요?',o:['위쪽 끝','가운데','아래쪽 끝'],a:2,e:'쇠구슬이 아래쪽 끝으로 굴러가면 무게중심이 앞으로 쏠려서 굴림통이 넘어가요.'},
 {q:'“구슬 빼기”로 바꾸고 출발해 봐요. 굴림통은 어떻게 되나요?',o:['더 빨리 내려와요','움직이지 않아요','거꾸로 올라가요'],a:1,e:'무게중심을 옮겨 줄 쇠구슬이 없어서 굴림통이 움직이지 않아요.'},
 {q:'“계단 간격”을 바꾸면 어떻게 되나요?',o:['계단에 걸리거나 떨어져요','아무 차이가 없어요','더 잘 내려와요'],a:0,e:'계단 간격과 균형이 굴림통에 딱 맞아야 데굴데굴 잘 내려와요. 만들 때 계단을 잘 맞추는 까닭이에요.'},
];
const Q2=[
 {q:'같은 힘으로 밀었을 때 어느 것이 더 멀리 갔나요?',o:['둥근 공','네모난 상자','똑같아요'],a:0,e:'둥근 물체는 바닥과 닿는 부분이 계속 바뀌며 굴러서 멀리 가요. 네모난 상자는 바닥에 끌리며 금방 멈춰요.'},
 {q:'공이 가장 멀리 굴러간 바닥은 어디인가요? (바닥을 바꿔 가며 실험해요)',o:['잔디','아스팔트','볼링장'],a:2,e:'바닥이 매끄러울수록 마찰이 작아서 더 멀리 굴러가요.'},
 {q:'볼링장 바닥을 매끄럽게 관리하는 까닭은 무엇일까요?',o:['마찰을 크게 하려고','마찰을 작게 해서 공이 잘 굴러가게 하려고','공이 금방 멈추게 하려고'],a:1,e:'마찰은 움직임을 방해하는 힘이에요. 매끄러우면 마찰이 작아져요.'},
];
function buildQs(el,qs,key){
  el.insertAdjacentHTML('beforeend',qs.map((z,i)=>`<div class="q"><p>${i+1}. ${z.q}</p><div class="opts">${z.o.map((t,j)=>`<button class="opt" type="button" data-i="${i}" data-j="${j}">${t}</button>`).join('')}</div><div class="fb" id="${key}fb${i}" aria-live="polite"></div></div>`).join(''));
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,j=+b.dataset.j,z=qs[i];
    el.querySelectorAll(`.opt[data-i="${i}"]`).forEach(x=>x.classList.remove('right','wrong'));
    const ok=j===z.a;b.classList.add(ok?'right':'wrong');const fb=$('#'+key+'fb'+i);fb.className='fb'+(ok?'':' no');
    fb.innerHTML=ok?`<b>딩동댕!</b> ${z.e}`:'<b>다시 관찰해 봐요!</b> 시뮬레이션을 한 번 더 돌려 보고 골라요.';if(ok)star(key+i)})
}
buildQs($('#qs1'),Q1,'q1_');buildQs($('#qs2'),Q2,'q2_');

/* 시작 */
reset1();reset2();
window.addEventListener('resize',()=>{const a=st&&st.running;reset1();reset2()});
go(store.get('tab','v-stairs'));
requestAnimationFrame(loop);
