<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지구 환경 변화 탐구소</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 질문 띠 → 탐구 정거장 4개 탭 → 정거장별 조작 패널(모식도 + 예상·확인) → 제출 */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --ink:#18213a; --muted:#5b6478; --line:#dde1ea;
  --navy:#1f2f5c; --gold:#c9962b; --gold-soft:#f6ecd3;
  --prod:#5b8a2f; --prod-soft:#e8f2dc; --c1:#d39b1f; --c1-soft:#fbf0d4; --c2:#2f7a8c; --c2-soft:#e0f0f3; --c3:#8a4f9e; --c3-soft:#f1e6f5;
  --good:#2e7d4f; --bad:#b4472f;
 --sun:#e8a317; --ir:#d9483b; --atm:#9cc7e8; --ground:#c9b48a; --warm:#f2a65a; --cold:#3d72b4; --cold-ink:#1d4f8f; --land:#8a7a5a; --air:#c2307a; --cloud:#c9d2de; --rain:#3d72b4; --space:#e6ecf7; --atmbox:#e3f0fa;
  --f-display:"Do Hyeon","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10152a; --surface:#1a2140; --ink:#e9ecf5; --muted:#a3abc2; --line:#2e3760;
  --navy:#9fb3ee; --gold:#e3b856; --gold-soft:#3a3220;
  --prod:#a6d27a; --prod-soft:#24361a; --c1:#f0c45a; --c1-soft:#3a3018; --c2:#7cc6d6; --c2-soft:#183842; --c3:#d3a2e3; --c3-soft:#33203b;
  --good:#7fd6a0; --bad:#f19b85; --sun:#f2bb3f; --ir:#ff7a6b; --atm:#4e7fa8; --ground:#6d5f45; --warm:#c97632; --cold:#2a4f80; --cold-ink:#8fc0ff; --land:#5c5240; --air:#f07ab5; --cloud:#5b6782; --rain:#8fc0ff; --space:#1c2546; --atmbox:#1a3148;
 color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10152a; --surface:#1a2140; --ink:#e9ecf5; --muted:#a3abc2; --line:#2e3760;
  --navy:#9fb3ee; --gold:#e3b856; --gold-soft:#3a3220;
  --prod:#a6d27a; --prod-soft:#24361a; --c1:#f0c45a; --c1-soft:#3a3018; --c2:#7cc6d6; --c2-soft:#183842; --c3:#d3a2e3; --c3-soft:#33203b;
  --good:#7fd6a0; --bad:#f19b85; --sun:#f2bb3f; --ir:#ff7a6b; --atm:#4e7fa8; --ground:#6d5f45; --warm:#c97632; --cold:#2a4f80; --cold-ink:#8fc0ff; --land:#5c5240; --air:#f07ab5; --cloud:#5b6782; --rain:#8fc0ff; --space:#1c2546; --atmbox:#1a3148;
 color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:3px solid var(--navy);padding-bottom:12px}
header h1{font-size:2.2rem;color:var(--navy);line-height:1.1}
.by{font-size:.85rem;color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--gold);font-weight:700;margin:0}
.question{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:6px;padding:16px 18px;display:grid;gap:6px}
.question p{margin:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;text-align:left;font:inherit;cursor:pointer;display:grid;gap:2px;position:relative}
.tab b{font-size:1rem}
.tab small{color:var(--muted);font-size:.8rem}
.tab .k{font-family:var(--f-display);color:var(--gold);font-size:1.1rem}
.tab[aria-selected="true"]{border-color:var(--navy);box-shadow:inset 0 -4px 0 var(--navy)}
.tab.done::after{content:"완료";position:absolute;top:8px;right:10px;font-size:.7rem;font-weight:700;color:var(--good)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:18px}
.panel h2{font-size:1.6rem;color:var(--navy)}
.lead{margin:0;max-width:68ch}
.src{font-size:.78rem;color:var(--muted)}
.step{display:grid;gap:8px}
.step h3{font-size:1.15rem}
.step h3 .n{color:var(--gold);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.chip:hover{border-color:var(--navy)}
.chip:disabled{opacity:.35;cursor:default}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.chip.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.chip.wrong{border-color:var(--bad);color:var(--bad)}
.fb{margin:0;font-size:.92rem;min-height:1.4em}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.btn{border:0;background:var(--navy);color:var(--surface);border-radius:6px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button:focus-visible,textarea:focus,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* 1. 먹이 사슬 */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.slot{min-width:104px;flex:1 1 104px;border:2px dashed var(--line);border-radius:8px;padding:8px;text-align:center;display:grid;gap:2px;align-content:center;min-height:84px}
.slot .ico{font-size:1.6rem;line-height:1}
.slot .lv{font-size:.75rem;color:var(--muted)}
.slot.filled{border-style:solid}
.slot.l0{border-color:var(--prod);background:var(--prod-soft)} .slot.l1{border-color:var(--c1);background:var(--c1-soft)}
.slot.l2{border-color:var(--c2);background:var(--c2-soft)} .slot.l3{border-color:var(--c3);background:var(--c3-soft)} .slot.l4{border-color:var(--navy);background:var(--gold-soft)}
.arrow{align-self:center;color:var(--gold);font-family:var(--f-display);font-size:1.3rem}
.note{background:var(--bg);border-radius:8px;padding:12px 14px;margin:0}
/* 2. 피라미드 */
.pyr{display:grid;gap:6px;justify-items:center;padding:8px 0}
.lvl{display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:10px;width:100%;cursor:pointer;border:0;background:none;font:inherit;color:inherit;padding:2px 0;text-align:left}
.lvl .bar{height:34px;border-radius:4px;justify-self:center;min-width:3px;transition:width .4s ease}
.lvl .nm{font-weight:700;font-size:.9rem}
.lvl .val{font-variant-numeric:tabular-nums;font-size:.9rem;text-align:right}
.ratio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ratio div{background:var(--bg);border-radius:8px;padding:10px;display:grid;gap:4px}
.ratio label{font-size:.85rem;font-weight:700}
.ratio input{width:100%}
.ratio output{font-variant-numeric:tabular-nums;font-size:.9rem}
.ratio .ans{font-size:.85rem;color:var(--good);min-height:1.3em}
/* 3. 시뮬레이터 */
.sim{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.stage{background:var(--bg);border-radius:10px;padding:14px;display:grid;gap:8px;align-content:start}
.stage .pyr{gap:4px}
.trow{display:grid;grid-template-columns:90px 1fr 46px;gap:8px;align-items:center;width:100%}
.trow .bar{height:30px;border-radius:4px;justify-self:center;transition:width .5s ease}
.trow .nm{font-size:.85rem;font-weight:700}
.trow .v{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.base{position:relative}
.timeline{display:flex;gap:4px;flex-wrap:wrap}
.timeline span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.timeline span.on{background:var(--gold)}
.pred{display:grid;gap:10px;align-content:start}
.pred .ev{background:var(--gold-soft);border-radius:8px;padding:10px 12px;margin:0}
.updown{display:flex;gap:8px}
.updown .chip{font-size:1.05rem;padding:6px 16px}
.verdict{border-radius:8px;padding:12px;margin:0;font-weight:700}
.verdict.ok{background:var(--prod-soft);color:var(--good)} .verdict.no{background:var(--c3-soft);color:var(--bad)}
/* 서술형 · 형성평가 */
.wq{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.wq .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--navy);color:var(--surface);width:max-content}
.wq .tag.adv{background:var(--gold)}
.wq .goal{font-size:.85rem;color:var(--muted);margin:0}
.wq .q{margin:0;font-weight:700}
.model{border-left:4px solid var(--good);background:var(--bg);padding:10px 14px;border-radius:0 6px 6px 0;margin:0}
.model b{color:var(--good)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.checks input{margin-top:5px;width:18px;height:18px;flex:none}
.checks .auto{font-size:.75rem;color:var(--good);font-weight:700}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--good);transition:width .4s ease}
.level{margin:0;font-weight:700}
.quizq{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.quizq:first-child{border-top:0;padding-top:0}
.quizq .q{margin:0;font-weight:700}
.opts{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt.right{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.qscore{font-weight:700;font-size:1.1rem;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.right,:root:not([data-theme="light"]) .chip.right{color:#10152a}}
:root[data-theme="dark"] .opt.right,:root[data-theme="dark"] .chip.right{color:#10152a}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:6px;padding:10px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.out{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:.88rem;max-height:260px;overflow:auto}
.toast{font-size:.9rem;color:var(--good)}
@media (max-width:860px){.tabs{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.tabs{grid-template-columns:1fr}.sim{grid-template-columns:1fr}.ratio{grid-template-columns:1fr}.lvl{grid-template-columns:84px 1fr 96px} header h1{font-size:1.8rem}}
@media (prefers-reduced-motion:reduce){.lvl .bar,.trow .bar{transition:none}}

/* 지구 환경 */
.scene{background:var(--bg);border-radius:10px;padding:8px;overflow-x:auto}
.scene svg{width:100%;height:auto;display:block;min-width:520px}
.gauge{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:12px 16px}
.gauge .big{font-family:var(--f-display);font-size:2.2rem;color:var(--navy);display:block;line-height:1.1}
.tnum{font-variant-numeric:tabular-nums}
.slider{flex:1 1 260px;display:grid;gap:4px}
.slider input{width:100%}
.ticks{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.seq{margin:0;padding-left:1.4em;display:grid;gap:4px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
thead th{background:var(--navy);color:var(--surface)}
tbody th{background:var(--bg);width:110px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pgrid>div{background:var(--bg);border-radius:8px;padding:10px;display:grid;gap:6px}
.bgrid{display:grid;gap:8px}
.bq{display:grid;grid-template-columns:1fr 90px 24px;gap:10px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 12px}
.bq span{display:grid}
.bq small{color:var(--muted)}
.bq input{font:inherit;font-size:1.1rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:100%}
.bq .mark{font-weight:700;color:var(--good)}
.quizbox{display:grid;gap:12px}
.pgroup{display:grid;gap:8px;border-left:4px solid var(--gold);padding-left:12px}
.pg{color:var(--navy)}
.pgrid>div{align-content:start}
.chips{align-items:flex-start}
.chip:disabled.right,.chip:disabled.wrong{opacity:1}
[hidden]{display:none!important}
body{margin:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <p class="eyebrow">통합과학 · 지구 환경의 변화</p>
    <h1>지구 환경 변화 탐구소</h1>
  </div>
  <div class="by">(made by. 무한쌤)</div>
</header>

<section class="question" aria-label="오늘의 질문">
  <p class="eyebrow">오늘의 질문</p>
  <p><b>탄소를 배출하면 왜 지구가 따뜻해질까? 표층 수온이 높아지면 그 지역의 날씨는 어떻게 될까?</b> 세 정거장을 탐구한 뒤 형성평가로 학습 목표를 점검하자.</p>
</section>

<div class="tabs" role="tablist" aria-label="탐구 정거장">
  <button class="tab" role="tab" id="tab-gh" aria-selected="true" data-t="gh"><span class="k">정거장 1</span><b>온실 효과와 지구 온난화</b><small>패딩을 여러 벌 입으면?</small></button>
  <button class="tab" role="tab" id="tab-pac" aria-selected="false" data-t="pac"><span class="k">정거장 2</span><b>태평양 적도: 평상시 vs 엘니뇨</b><small>무역풍이 약해지면?</small></button>
  <button class="tab" role="tab" id="tab-bud" aria-selected="false" data-t="bud"><span class="k">정거장 3 · 심화</span><b>지구 열수지</b><small>들어온 만큼 나간다</small></button>
  <button class="tab" role="tab" id="tab-quiz" aria-selected="false" data-t="quiz"><span class="k">평가</span><b>형성평가</b><small>학습 목표 점검</small></button>
</div>

<section class="panel" id="panel" role="tabpanel" aria-live="polite"></section>

</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="earth-change-v1";
let st={tab:"gh",atm:true,eps:0.77,q:{},order:[],pac:"normal",pred:{},pacShown:false,bud:{},budChk:false,chain:{},w:{},qz:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)st=Object.assign(st,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function mcq(id,opts,ans,okMsg,noMsg){const p=st.q[id];
  return `<div class="chips">${opts.map((t,j)=>`<button type="button" class="chip ${p===j?(j===ans?'right':'wrong'):''}" data-q="${id}" data-j="${j}" aria-pressed="${p===j}">${t}</button>`).join("")}</div>
  ${p===undefined?'<p class="fb"></p>':(p===ans?`<p class="fb ok">${okMsg}</p>`:`<p class="fb no">${noMsg}</p>`)}`}

/* ---------- 정거장 1: 온실 효과 ---------- */
const BASE_EPS=0.77;
const tempC=e=>255*Math.pow(2/(2-e),.25)-273.15;
function ghScene(e){
  const up=Math.round(6*(1-e)), back=Math.round(6*e);
  const arr=(x,y1,y2,c,id)=>`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="var(${c})" stroke-width="5" marker-end="url(#ah-${id})"/>`;
  let s=`<svg viewBox="0 0 640 300" role="img" aria-label="지구의 에너지 출입 모식도"><defs>
   <marker id="ah-sun" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--sun)"/></marker>
   <marker id="ah-ir" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ir)"/></marker></defs>
   <rect x="0" y="250" width="640" height="50" fill="var(--ground)"/>
   <circle cx="70" cy="50" r="32" fill="var(--sun)"/>`;
  if(st.atm) s+=`<rect x="0" y="95" width="640" height="${40+e*40}" fill="var(--atm)" opacity="${.25+e*.6}"/><text x="630" y="112" text-anchor="end" font-size="13" fill="var(--muted)">대기 (온실기체)</text>`;
  for(let i=0;i<4;i++){const x=120+i*38;s+=`<line x1="${x-30}" y1="80" x2="${x+20}" y2="245" stroke="var(--sun)" stroke-width="5" marker-end="url(#ah-sun)"/>`}
  s+=`<text x="120" y="275" font-size="13" fill="var(--ink)">태양 복사 에너지</text>`;
  const n=6;for(let i=0;i<n;i++){const x=380+i*40;
    if(!st.atm||i<up){s+=arr(x,245,30,"--ir","ir")}
    else{s+=arr(x,245,125,"--ir","ir");s+=`<line x1="${x+14}" y1="128" x2="${x+14}" y2="240" stroke="var(--ir)" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ah-ir)"/>`}}
  s+=`<text x="380" y="272" font-size="13" fill="var(--ink)">지구 복사 에너지</text>${st.atm?'<text x="380" y="292" font-size="12" fill="var(--ink)">점선: 대기가 지표로 재방출</text>':''}</svg>`;
  return s;
}
const ORDER=["인간 활동으로 탄소(이산화 탄소) 배출","대기 중 온실기체 양 증가","온실기체가 흡수하는 지구 복사 에너지 증가","지표로 재방출하는 에너지 증가","지구 평균 기온 상승 (지구 온난화)"];
const SHUF=[3,0,4,1,2];
function ghView(){
  const e=st.atm?st.eps:0, T=tempC(e);
  const done=st.order.length===5, ok=done&&st.order.every((x,i)=>x===i);
  return `<h2>온실 효과와 지구 온난화</h2>
  <p class="lead">지구는 태양에게서 흡수한 에너지만큼 우주로 방출한다(태양 복사 에너지 = 지구 복사 에너지). 대기가 있으면 무엇이 달라질까?</p>
  <div class="step"><h3><span class="n">①</span>예상하기: 지구에 대기가 없다면 지구 평균 기온은 약 몇 ℃일까?</h3>

const QZ=[

];
function wqView(){
  return WQ.map(w=>{const a=st.w[w.id]||{};const txt=a.t||"";
    const auto=w.keys.map(k=>k[1].every(r=>r.test(txt.replace(/\s+/g," "))));
    const got=w.keys.map((k,i)=>auto[i]||!!(a.c&&a.c[i]));const n=got.filter(Boolean).length,N=w.keys.length,p=Math.round(n/N*100);
    const lvl=p>=80?["목표 달성! 핵심 요소를 거의 모두 설명했다.","ok"]:p>=50?["거의 다 왔다. 빠진 요소를 넣어 고쳐 쓰자.",""]:["다시 도전! 모범 답안의 흐름을 참고해 고쳐 쓰자.","no"];
    return `<div class="wq"><span class="tag ${w.lv==='심화'?'adv':''}">${w.lv}</span><p class="goal">학습 목표: ${w.goal}</p><p class="q">${w.q}</p>
    <label class="src" for="t-${w.id}">내 문장으로 답 쓰기</label><textarea id="t-${w.id}" data-w="${w.id}" placeholder="내 말로 설명해 보자.">${esc(txt)}</textarea>
    <div class="row"><button class="btn" type="button" data-cmp="${w.id}" ${txt.trim().length<15?'disabled':''}>모범 답안과 비교하기</button>${a.shown?'<span class="src">답을 고친 뒤 다시 누르면 점검이 갱신된다.</span>':''}</div>
    ${a.shown?`<p class="model"><b>모범 답안</b> ${esc(w.model)}</p>
    <p class="src" style="margin:0">핵심 요소 점검: 자동으로 찾은 요소는 체크되어 있다. 내 답에 들어 있는데 체크되지 않았다면 직접 체크하자.</p>
    <ul class="checks">${w.keys.map((k,i)=>`<li><input type="checkbox" id="c-${w.id}-${i}" data-ck="${w.id}" data-i="${i}" ${got[i]?'checked':''} ${auto[i]?'disabled':''}><label for="c-${w.id}-${i}">${k[0]} ${auto[i]?'<span class="auto">자동 확인</span>':''}</label></li>`).join("")}</ul>
    <div class="meter" aria-label="목표 도달도"><span style="width:${p}%"></span></div>
    <p class="level fb ${lvl[1]}">목표 도달도 ${n}/${N} · ${lvl[0]}</p>`:''}</div>`}).join("");
}
function wqScore(w){const a=st.w[w.id]||{};const txt=(a.t||"").replace(/\s+/g," ");return w.keys.filter((k,i)=>k[1].every(r=>r.test(txt))||(a.c&&a.c[i])).length}
function quizScore(){return QZ.filter((x,i)=>st.qz[i]===x.a).length}
function quizView(){
  const n=quizScore();
  return `<h2>형성평가</h2>
  <p class="lead"><b>Part 1. 선택형</b> 답을 고르면 바로 채점된다. 틀리면 힌트를 읽고 다시 골라 보자.</p>
  <div class="quizbox">${QZ.map((x,i)=>{const p=st.qz[i];const ok=p===x.a;
    return `<div class="quizq"><p class="q">${i+1}. ${x.q}</p><div class="opts">${x.o.map((t,j)=>`<button type="button" class="opt ${p===j?(ok?'right':'wrong'):''}" data-qz="${i}" data-j="${j}" ${ok?'disabled':''}>${String.fromCharCode(9312+j)} ${t}</button>`).join("")}</div>
    ${p===undefined?'':(ok?`<p class="fb ok">정답! ${x.e}</p>`:`<p class="fb no">다시 생각해 보자. 힌트: ${x.h}</p>`)}</div>`}).join("")}</div>
  <div class="qscore">선택형 ${n} / ${QZ.length}${n===QZ.length?"  · 모두 맞혔다!":""}</div>
  <p class="lead"><b>Part 2. 서술형</b> 내 문장으로 답을 쓰고, <b>모범 답안과 비교하기</b>를 눌러 학습 목표에 얼마나 가까워졌는지 점검하자.</p>
  ${wqView()}`;
}

/* ---------- 공통 ---------- */
const VIEWS={gh:ghView,pac:pacView,bud:budView,quiz:quizView};
function isDone(t){
  if(t==="gh")return st.q.noatm===1&&st.q.pad===0&&st.order.length===5&&st.order.every((x,i)=>x===i);
  if(t==="pac")return st.pacShown&&st.q.fish===0;
  if(t==="bud")return st.budChk&&BQ.every(q=>+st.bud[q[0]]===q[3])&&CQ.every(q=>st.chain[q[0]]===q[3]);
  return quizScore()===QZ.length&&WQ.every(w=>{const a=st.w[w.id];return a&&a.shown&&wqScore(w)/w.keys.length>=.8});
}
function renderOut(){
  const L=[];
  if(st.atm)L.push(`[온실기체 양 실험] 마지막 설정 기온 ${tempC(st.eps).toFixed(1)}℃`);
  if(st.order.length===5)L.push(`[지구 온난화 메커니즘] ${st.order.map(i=>ORDER[i]).join(" → ")}`);
  if(st.pacShown)L.push(`[엘니뇨 예상] 적중 ${PQ.filter(q=>st.pred[q[0]]===q[3]).length}/${PQ.length}`);
  if(st.budChk)L.push(`[열수지 계산] ${BQ.filter(q=>+st.bud[q[0]]===q[3]).length}/5 · [CO2 증가 추론] ${CQ.filter(q=>st.chain[q[0]]===q[3]).length}/4`);
  if(Object.keys(st.qz).length)L.push(`[형성평가 선택형] ${quizScore()} / ${QZ.length}`);
  WQ.forEach((w,i)=>{const a=st.w[w.id];if(a&&a.t&&a.t.trim())L.push(`[서술형 ${i+1} · ${w.lv}] ${a.t.trim()}${a.shown?` (목표 도달도 ${wqScore(w)}/${w.keys.length})`:""}`)});
  const o=$("out");if(o)o.textContent=L.length?L.join("\n"):"";
}
function render(){
  document.querySelectorAll(".tab").forEach(b=>{b.setAttribute("aria-selected",String(b.dataset.t===st.tab));b.classList.toggle("done",isDone(b.dataset.t))});
  $("panel").innerHTML=VIEWS[st.tab]()+nextBtn(); renderOut(); save();
}
function nextBtn(){const order=["gh","pac","bud","quiz"],i=order.indexOf(st.tab);if(i===order.length-1)return "";
  const names={pac:"정거장 2로",bud:"정거장 3으로",quiz:"형성평가로"};return `<div class="row"><button class="btn ghost" type="button" data-t="${order[i+1]}">${names[order[i+1]]} 가기 →</button></div>`}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.t){const fromTab=b.classList.contains("tab");st.tab=b.dataset.t;render();if(!fromTab)document.querySelector(".tabs").scrollIntoView({behavior:"smooth",block:"start"});return}
  if(b.dataset.q){st.q[b.dataset.q]=+b.dataset.j;render();return}
  if(b.dataset.atm){st.atm=b.dataset.atm==="1";render();return}
  if(b.dataset.ord!==undefined){if(st.order.length<5)st.order.push(+b.dataset.ord);render();return}
  if(b.id==="ord-reset"){st.order=[];render();return}
  if(b.dataset.pac){st.pac=b.dataset.pac;render();return}
  if(b.dataset.pr){st.pred[b.dataset.pr]=+b.dataset.j;render();return}
  if(b.id==="pac-check"){st.pacShown=true;st.pac="nino";render();return}
  if(b.id==="pac-reset"){st.pacShown=false;st.pred={};st.pac="normal";delete st.q.fish;render();return}
  if(b.id==="bud-check"){st.budChk=true;render();return}
  if(b.dataset.ch){st.chain[b.dataset.ch]=+b.dataset.j;render();return}
  if(b.dataset.cmp){const a=st.w[b.dataset.cmp]=st.w[b.dataset.cmp]||{};a.shown=true;render();return}
  if(b.dataset.qz!==undefined){st.qz[b.dataset.qz]=+b.dataset.j;render();return}
  if(b.id==="copy"){const t=$("out").textContent;const ok=()=>{$("toast").textContent="복사했어요."};
    const fail=()=>{const r=document.createRange();r.selectNodeContents($("out"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);$("toast").textContent="자동 복사가 막혀 있어요. 선택된 글을 Ctrl+C로 복사하세요."};
    try{navigator.clipboard.writeText(t).then(ok,fail)}catch(err){fail()}}
});
document.addEventListener("input",e=>{
  if(e.target.id==="eps"){st.eps=+e.target.value;const sc=document.querySelector(".scene");sc.innerHTML=ghScene(st.eps);$("tval").textContent=tempC(st.eps).toFixed(1)+"℃";renderOut();save();return}
  if(e.target.dataset.b){st.bud[e.target.dataset.b]=e.target.value;save();return}
  if(e.target.dataset.w){const a=st.w[e.target.dataset.w]=st.w[e.target.dataset.w]||{};a.t=e.target.value;const bt=document.querySelector(`[data-cmp="${e.target.dataset.w}"]`);if(bt)bt.disabled=a.t.trim().length<15;renderOut();save();return}
});
document.addEventListener("change",e=>{if(e.target.dataset.ck){const a=st.w[e.target.dataset.ck]=st.w[e.target.dataset.ck]||{};a.c=a.c||{};a.c[e.target.dataset.i]=e.target.checked;render()}});
render();
</script>

</body>
